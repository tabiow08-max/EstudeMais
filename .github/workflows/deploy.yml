# Publica o app instalável no GitHub Pages (branch gh-pages) a cada atualização.
name: Publicar app

on:
  push:
    branches: [main, ccr-a5f3bf87-di42qt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-app
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
